<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>الحصالة — متابعة الإيداعات والمصروفات</title>
<meta name="description" content="تطبيق بسيط لمتابعة الحصالة والإيداعات والمصروفات شهرياً." />
<meta name="theme-color" content="#064E3B" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="الحصالة" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
  :root { color-scheme: light; }
  html, body { background: #F1F5F9; }
  body { font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; margin: 0; }
  .font-serif-ar { font-family: 'El Messiri', 'IBM Plex Sans Arabic', serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn .15s ease-out; }
  .animate-modal-in { animation: modalIn .2s ease-out; }
  :focus-visible { outline: 2px solid #064E3B; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .animate-fade-in, .animate-modal-in { animation: none; }
    * { transition-duration: .01ms !important; }
  }
  input, select, textarea, button { font-family: inherit; }
  .boot { display: flex; min-height: 100vh; align-items: center; justify-content: center; color: #94A3B8; font-size: 14px; }
  @media print {
    .no-print { display: none !important; }
    body * { visibility: hidden; }
    #printable-report, #printable-report * { visibility: visible; }
    #printable-report { position: absolute; inset: 0; width: 100%; padding: 12px 24px; }
  }
</style>
</head>
<body>
<div id="root"><div class="boot">جارِ التحميل...</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = 'piggybank-tracker-v2-state';
const INK = { dark: '#064E3B', deposit: '#059669', expense: '#BE123C' };
const PALETTE = ['#0D9488', '#EA580C', '#7C3AED', '#0891B2', '#65A30D', '#DB2777'];

const ICON_PATHS = {
  plus: <><path d="M5 12h14" /><path d="M12 5v14" /></>,
  minus: <path d="M5 12h14" />,
  wallet: (
    <>
      <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
    </>
  ),
  trash: (
    <>
      <path d="M3 6h18" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <path d="M10 11v6" />
      <path d="M14 11v6" />
    </>
  ),
  x: <><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>,
  check: <path d="M20 6 9 17l-5-5" />,
  pencil: (
    <>
      <path d="M21.2 6.8a1.4 1.4 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z" />
      <path d="m15 5 4 4" />
    </>
  ),
  archive: (
    <>
      <rect width="20" height="5" x="2" y="3" rx="1" />
      <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" />
      <path d="M10 12h4" />
    </>
  ),
  file: (
    <>
      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
      <path d="M14 2v4a2 2 0 0 0 2 2h4" />
      <path d="M10 9H8" />
      <path d="M16 13H8" />
      <path d="M16 17H8" />
    </>
  ),
  chevronLeft: <path d="m15 18-6-6 6-6" />,
  chevronRight: <path d="m9 18 6-6-6-6" />,
  lock: (
    <>
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </>
  )
};

function Icon({ name, size = 16, style, className }) {
  return (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      style={style}
      className={className}
      aria-hidden="true"
    >
      {ICON_PATHS[name]}
    </svg>
  );
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function pad(n) {
  return String(n).padStart(2, '0');
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function currentMonthKeyStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}

function formatAmount(n) {
  return Number(n || 0).toLocaleString('en-US');
}

function formatDateOnly(dateStr) {
  try {
    if (!dateStr) return '';
    const d = new Date(`${dateStr}T00:00:00`);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) {
    return dateStr || '';
  }
}

function formatMonthName(monthKey) {
  try {
    const [year, month] = monthKey.split('-');
    const d = new Date(Number(year), Number(month) - 1, 1);
    return d.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
  } catch(e) {
    return monthKey;
  }
}

function getNextMonthKey(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  const d = new Date(year, month, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}

function getPrevMonthKey(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  const d = new Date(year, month - 2, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}

function startOfMonthStr(monthKey) {
  return `${monthKey}-01`;
}

function endOfMonthStr(monthKey) {
  const [y, m] = monthKey.split('-').map(Number);
  const d = new Date(y, m, 0);
  return `${monthKey}-${pad(d.getDate())}`;
}

function getMonthOpeningBalance(bank, monthKey) {
  if (!bank.months) return 0;
  const sortedMonths = Object.keys(bank.months).sort();
  if (sortedMonths.length === 0 || monthKey <= sortedMonths[0]) {
    return 0;
  }

  let cumulative = 0;
  for (const m of sortedMonths) {
    if (m >= monthKey) break;
    const mData = bank.months[m] || { transactions: [] };
    const deposits = (mData.transactions || [])
      .filter(t => t.type === 'deposit')
      .reduce((sum, t) => sum + Number(t.amount || 0), 0);
    const expenses = (mData.transactions || [])
      .filter(t => t.type === 'expense')
      .reduce((sum, t) => sum + Number(t.amount || 0), 0);
    cumulative += (deposits - expenses);
  }
  return cumulative;
}

function computeReport(bank, fromDate, toDate) {
  let opening = 0;
  let depositTotal = 0;
  let expenseTotal = 0;

  const depositByTarget = {};
  const expenseByTarget = {};
  const rows = [];

  const sortedMonths = Object.keys(bank.months || {}).sort();

  sortedMonths.forEach((m) => {
    const mData = bank.months[m];
    (mData.transactions || []).forEach((t) => {
      const amt = Number(t.amount || 0);
      const target = t.note || 'غير محدد';

      if (fromDate && t.date < fromDate) {
        opening += (t.type === 'deposit' ? amt : -amt);
      } else if (!toDate || t.date <= toDate) {
        rows.push(t);
        if (t.type === 'deposit') {
          depositTotal += amt;
          depositByTarget[target] = (depositByTarget[target] || 0) + amt;
        } else {
          expenseTotal += amt;
          expenseByTarget[target] = (expenseByTarget[target] || 0) + amt;
        }
      }
    });
  });

  rows.sort((a, b) => a.date.localeCompare(b.date));

  return {
    bankName: bank.name,
    fromDate,
    toDate,
    rows,
    opening,
    depositTotal,
    expenseTotal,
    closing: opening + depositTotal - expenseTotal,
    depositByTarget,
    expenseByTarget,
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function saveState(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

function App() {
  const [loading, setLoading] = useState(true);
  const [banks, setBanks] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [selectedMonth, setSelectedMonth] = useState(currentMonthKeyStr());
  const [filterType, setFilterType] = useState('all');
  const [modal, setModal] = useState(null);
  const [editingTx, setEditingTx] = useState(null);
  const [storageError, setStorageError] = useState(false);
  const [depositors, setDepositors] = useState([]);
  const [destinations, setDestinations] = useState([]);
  const [reportData, setReportData] = useState(null);
  const loadedRef = useRef(false);

  useEffect(() => {
    const data = loadState();
    if (data) {
      setBanks(data.banks || []);
      setActiveId(data.activeId || (data.banks && data.banks[0] && data.banks[0].id) || null);
      setDepositors(data.depositors || []);
      setDestinations(data.destinations || []);
    }
    loadedRef.current = true;
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!loadedRef.current) return;
    const ok = saveState({ banks, activeId, depositors, destinations });
    setStorageError(!ok);
  }, [banks, activeId, depositors, destinations]);

  const activeBank = banks.find((b) => b.id === activeId) || null;

  const currentMonthData = activeBank && activeBank.months ? (activeBank.months[selectedMonth] || { transactions: [], closed: false }) : { transactions: [], closed: false };
  const openingBalance = activeBank ? getMonthOpeningBalance(activeBank, selectedMonth) : 0;

  const monthlyDeposits = currentMonthData.transactions
    .filter(t => t.type === 'deposit')
    .reduce((acc, t) => acc + Number(t.amount || 0), 0);

  const monthlyExpenses = currentMonthData.transactions
    .filter(t => t.type === 'expense')
    .reduce((acc, t) => acc + Number(t.amount || 0), 0);

  const currentMonthClosing = openingBalance + monthlyDeposits - monthlyExpenses;

  const filteredTx = currentMonthData.transactions.filter(
    (t) => filterType === 'all' || t.type === filterType
  );

  function createBank(name, color) {
    const startM = currentMonthKeyStr();
    const nb = { 
      id: uid(), 
      name, 
      color, 
      months: {
        [startM]: { transactions: [], closed: false }
      } 
    };
    setBanks((prev) => [...prev, nb]);
    setActiveId(nb.id);
    setSelectedMonth(startM);
    setModal(null);
  }

  function addTransaction(type, { amount, date, note }) {
    if (!activeBank) return;
    const tx = {
      id: uid(),
      type,
      amount: Number(amount),
      date,
      note,
      createdAt: new Date().toISOString(),
    };

    setBanks((prev) =>
      prev.map((b) => {
        if (b.id !== activeBank.id) return b;
        const mKey = date.slice(0, 7);
        const monthObj = b.months[mKey] || { transactions: [], closed: false };
        return {
          ...b,
          months: {
            ...b.months,
            [mKey]: {
              ...monthObj,
              transactions: [tx, ...(monthObj.transactions || [])]
            }
          }
        };
      })
    );
    closeModal();
  }

  function editTransaction(txId, { amount, date, note }) {
    if (!activeBank) return;
    setBanks((prev) =>
      prev.map((b) => {
        if (b.id !== activeBank.id) return b;
        const newMonths = { ...b.months };
        
        Object.keys(newMonths).forEach(mKey => {
          newMonths[mKey] = {
            ...newMonths[mKey],
            transactions: newMonths[mKey].transactions.filter(t => t.id !== txId)
          };
        });

        const mKey = date.slice(0, 7);
        const targetMonth = newMonths[mKey] || { transactions: [], closed: false };
        const updatedTx = {
          ...editingTx,
          amount: Number(amount),
          date,
          note,
          editedAt: new Date().toISOString()
        };

        newMonths[mKey] = {
          ...targetMonth,
          transactions: [updatedTx, ...targetMonth.transactions]
        };

        return { ...b, months: newMonths };
      })
    );
    closeModal();
  }

  function deleteTransaction(txId) {
    if (!activeBank) return;
    setBanks((prev) =>
      prev.map((b) => {
        if (b.id !== activeBank.id) return b;
        const newMonths = { ...b.months };
        Object.keys(newMonths).forEach(mKey => {
          newMonths[mKey] = {
            ...newMonths[mKey],
            transactions: newMonths[mKey].transactions.filter(t => t.id !== txId)
          };
        });
        return { ...b, months: newMonths };
      })
    );
  }

  function closeCurrentMonth() {
    if (!activeBank) return;
    const nextM = getNextMonthKey(selectedMonth);
    setBanks((prev) =>
      prev.map((b) => {
        if (b.id !== activeBank.id) return b;
        const nextMonthObj = b.months[nextM] || { transactions: [], closed: false };
        return {
          ...b,
          months: {
            ...b.months,
            [selectedMonth]: {
              ...(b.months[selectedMonth] || { transactions: [] }),
              closed: true
            },
            [nextM]: nextMonthObj
          }
        };
      })
    );
    setSelectedMonth(nextM);
  }

  function deleteBank(bankId) {
    setBanks((prev) => {
      const next = prev.filter((b) => b.id !== bankId);
      if (activeId === bankId) setActiveId(next[0] ? next[0].id : null);
      return next;
    });
  }

  function restoreBackup(data) {
    if (!data || !Array.isArray(data.banks)) return false;
    setBanks(data.banks);
    setActiveId(data.activeId || (data.banks[0] && data.banks[0].id) || null);
    setModal(null);
    return true;
  }

  function addEntry(listName, value) {
    const v = (value || '').trim();
    if (!v) return;
    if (listName === 'depositors') {
      setDepositors((prev) => (prev.includes(v) ? prev : [...prev, v]));
    } else {
      setDestinations((prev) => (prev.includes(v) ? prev : [...prev, v]));
    }
  }

  function generateReport(fromDate, toDate) {
    if (!activeBank) return;
    setReportData(computeReport(activeBank, fromDate, toDate));
    setModal('reportView');
  }

  function closeModal() {
    setModal(null);
    setEditingTx(null);
  }

  function openEditTx(t) {
    setEditingTx(t);
    setModal('editTx');
  }

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">جارِ التحميل...</div>;
  }

  return (
    <div dir="rtl" className="min-h-screen bg-slate-100 text-slate-800">
      <div className="sticky top-0 z-20 bg-white border-b border-slate-200">
        <div className="flex items-center justify-between px-3 pt-2">
          <div className="flex items-stretch gap-1 overflow-x-auto no-scrollbar">
            {banks.map((bank) => {
              const isActive = bank.id === activeId;
              return (
                <button
                  key={bank.id}
                  onClick={() => setActiveId(bank.id)}
                  className={`shrink-0 px-4 py-2.5 text-sm whitespace-nowrap transition-colors ${
                    isActive ? 'text-slate-800 font-semibold' : 'text-slate-400 hover:text-slate-600'
                  }`}
                  style={{ borderBottom: isActive ? `3px solid ${bank.color}` : '3px solid transparent' }}
                >
                  {bank.name}
                </button>
              );
            })}
            <button
              onClick={() => setModal('newBank')}
              className="shrink-0 flex items-center gap-1 px-3 py-2.5 text-sm text-slate-400 hover:text-slate-700"
            >
              <Icon name="plus" size={16} />
              حصالة جديدة
            </button>
          </div>

          {activeBank && (
            <button
              onClick={() => setModal('deleteBank')}
              className="flex items-center gap-1 text-xs text-rose-600 hover:text-rose-800 px-2 py-1.5 rounded-lg hover:bg-rose-50 transition-colors shrink-0"
              title="حذف الحصالة"
            >
              <Icon name="trash" size={15} />
              <span className="hidden sm:inline">حذف الحصالة</span>
            </button>
          )}
        </div>
      </div>

      {storageError && (
        <div className="max-w-lg mx-auto mt-3 px-4">
          <div className="rounded-lg border border-amber-200 bg-amber-50 text-amber-800 text-xs px-3 py-2">
            المتصفح مانع الحفظ المحلي، فالبيانات ستضيع عند إغلاق الصفحة.
          </div>
        </div>
      )}

      {!activeBank && (
        <div className="flex flex-col items-center justify-center px-6 py-24 text-center">
          <div className="w-14 h-14 rounded-full flex items-center justify-center mb-4" style={{ background: 'rgba(6,78,59,0.08)' }}>
            <Icon name="wallet" size={24} style={{ color: INK.dark }} />
          </div>
          <h2 className="font-serif-ar text-xl mb-2">ابدأ بإنشاء أول حصالة</h2>
          <p className="text-sm text-slate-500 mb-5 max-w-xs">
            تابع الإيداعات والمصروفات شهرياً مع إمكانية التقفيل الدوري
          </p>
          <button onClick={() => setModal('newBank')} className="px-5 py-2.5 rounded-lg text-white text-sm" style={{ background: INK.dark }}>
            إنشاء حصالة
          </button>
        </div>
      )}

      {activeBank && (
        <div className="max-w-lg mx-auto px-4 pb-16 pt-4">
          <div className="flex items-center justify-between bg-white rounded-xl p-2.5 border border-slate-200 mb-5">
            <button
              onClick={() => setSelectedMonth(getPrevMonthKey(selectedMonth))}
              className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg"
            >
              <Icon name="chevronRight" size={18} />
            </button>
            <div className="text-center font-medium text-sm text-slate-700">
              {formatMonthName(selectedMonth)}
            </div>
            <button
              onClick={() => setSelectedMonth(getNextMonthKey(selectedMonth))}
              className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg"
            >
              <Icon name="chevronLeft" size={18} />
            </button>
          </div>

          <div className="bg-white rounded-2xl p-5 border border-slate-200 mb-6 text-center shadow-sm">
            <div className="text-xs text-slate-400 mb-1">الرصيد النهائي للشهر</div>
            <div className="flex items-baseline justify-center gap-2 mb-4">
              <span className="font-serif-ar text-5xl font-semibold" dir="ltr" style={{ color: INK.dark }}>
                {formatAmount(currentMonthClosing)}
              </span>
              <span className="text-sm text-slate-500">ج.م</span>
            </div>

            <div className="grid grid-cols-2 gap-2 text-xs border-t border-slate-100 pt-3">
              <div className="text-slate-500">
                <span>الرصيد الافتتاحي: </span>
                <span dir="ltr" className="font-semibold text-slate-700">{formatAmount(openingBalance)}</span> ج.م
              </div>
              <div className="text-slate-500">
                <span>إجمالي التغير: </span>
                <span dir="ltr" className="font-semibold" style={{ color: monthlyDeposits - monthlyExpenses >= 0 ? INK.deposit : INK.expense }}>
                  {monthlyDeposits - monthlyExpenses >= 0 ? '+' : ''}{formatAmount(monthlyDeposits - monthlyExpenses)}
                </span> ج.م
              </div>
            </div>

            {currentMonthData.closed ? (
              <div className="mt-4 inline-flex items-center gap-1 px-3 py-1 bg-slate-100 text-slate-500 text-xs rounded-full">
                <Icon name="lock" size={12} />
                تم تقفيل هذا الشهر
              </div>
            ) : (
              <button
                onClick={closeCurrentMonth}
                className="mt-4 inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg border border-emerald-600 text-emerald-700 hover:bg-emerald-50 text-xs font-medium transition-colors"
              >
                تقفيل حصالة الشهر والانتقال للشهر التالي
              </button>
            )}
          </div>

          <div className="grid grid-cols-2 gap-3 mb-6">
            <button
              onClick={() => setModal('deposit')}
              className="flex items-center justify-center gap-2 py-3 rounded-xl text-white text-sm font-medium shadow-sm"
              style={{ background: INK.deposit }}
            >
              <Icon name="plus" size={16} /> إيداع جديد
            </button>
            <button
              onClick={() => setModal('expense')}
              className="flex items-center justify-center gap-2 py-3 rounded-xl text-white text-sm font-medium shadow-sm"
              style={{ background: INK.expense }}
            >
              <Icon name="minus" size={16} /> صرف جديد
            </button>
          </div>

          <div>
            <div className="flex items-center justify-between mb-3">
              <div className="text-xs font-semibold text-slate-500">سجل معاملات الشهر</div>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setModal('reportPeriod')}
                  className="inline-flex items-center gap-1 text-xs text-slate-500 hover:text-slate-800"
                >
                  <Icon name="file" size={13} />
                  تقرير PDF
                </button>
                <button
                  onClick={() => setModal('backup')}
                  className="inline-flex items-center gap-1 text-xs text-slate-500 hover:text-slate-800"
                >
                  <Icon name="archive" size={13} />
                  نسخة احتياطية
                </button>
              </div>
            </div>

            <div className="flex items-center gap-2 mb-3">
              {[
                ['all', 'الكل'],
                ['deposit', 'إيداع'],
                ['expense', 'صرف'],
              ].map(([val, label]) => (
                <button
                  key={val}
                  onClick={() => setFilterType(val)}
                  className="px-3 py-1 rounded-full text-xs border"
                  style={
                    filterType === val
                      ? { background: INK.dark, borderColor: INK.dark, color: 'white' }
                      : { background: 'white', borderColor: '#E2E8F0', color: '#64748B' }
                  }
                >
                  {label}
                </button>
              ))}
            </div>

            {filteredTx.length === 0 ? (
              <div className="text-center py-10 text-sm text-slate-400 bg-white rounded-xl border border-slate-200">
                لا توجد معاملات مسجلة لهذا الشهر
              </div>
            ) : (
              <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden shadow-sm">
                {filteredTx.map((t) => {
                  const isDeposit = t.type === 'deposit';
                  return (
                    <div key={t.id} className="group flex items-center justify-between px-4 py-3">
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-medium text-slate-800 truncate">
                          {t.note || (isDeposit ? 'إيداع' : 'صرف')}
                        </div>
                        <div className="text-xs text-slate-400">
                          {formatDateOnly(t.date)}
                        </div>
                      </div>
                      <div className="flex items-center gap-3 shrink-0">
                        <span
                          dir="ltr"
                          className="text-sm font-semibold tabular-nums"
                          style={{ color: isDeposit ? INK.deposit : INK.expense }}
                        >
                          {isDeposit ? '+' : '\u2212'}
                          {formatAmount(t.amount)}
                        </span>
                        <div className="flex items-center gap-1 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                          <button
                            onClick={() => openEditTx(t)}
                            aria-label="تعديل"
                            className="text-slate-300 hover:text-slate-600 p-1"
                          >
                            <Icon name="pencil" size={13} />
                          </button>
                          <button
                            onClick={() => deleteTransaction(t.id)}
                            aria-label="حذف"
                            className="text-slate-300 hover:text-rose-600 p-1"
                          >
                            <Icon name="trash" size={13} />
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      )}

      {modal === 'newBank' && <NewBankModal onClose={() => setModal(null)} onCreate={createBank} usedCount={banks.length} />}
      {(modal === 'deposit' || modal === 'expense' || modal === 'editTx') &&
        (() => {
          const txType = modal === 'editTx' ? editingTx.type : modal;
          const isDep = txType === 'deposit';
          return (
            <TxModal
              type={txType}
              initialData={modal === 'editTx' ? editingTx : null}
              selectedMonth={selectedMonth}
              list={isDep ? depositors : destinations}
              onAddEntry={(v) => addEntry(isDep ? 'depositors' : 'destinations', v)}
              onClose={closeModal}
              onSubmit={(data) => {
                if (modal === 'editTx') editTransaction(editingTx.id, data);
                else addTransaction(modal, data);
              }}
            />
          );
        })()}
      {modal === 'backup' && <BackupModal data={{ banks, activeId }} onClose={() => setModal(null)} onRestore={restoreBackup} />}
      {modal === 'reportPeriod' && activeBank && (
        <ReportPeriodModal defaultMonth={selectedMonth} onClose={() => setModal(null)} onGenerate={generateReport} />
      )}
      {modal === 'reportView' && reportData && (
        <ReportView report={reportData} onClose={() => { setModal(null); setReportData(null); }} />
      )}
      {modal === 'deleteBank' && activeBank && (
        <ConfirmModal
          title="حذف الحصالة"
          message={`هل تريد حذف "${activeBank.name}" وكل معلماتها السابقة والشهور بالكامل؟ لا يمكن التراجع عن ذلك.`}
          onCancel={() => setModal(null)}
          onConfirm={() => {
            deleteBank(activeBank.id);
            setModal(null);
          }}
        />
      )}
    </div>
  );
}

function ModalShell({ title, onClose, children }) {
  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') onClose();
    }
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
      <div className="absolute inset-0 animate-fade-in" style={{ background: 'rgba(15,23,42,0.35)' }} onClick={onClose} />
      <div
        dir="rtl"
        role="dialog"
        aria-modal="true"
        className="relative bg-white w-full sm:w-96 sm:rounded-2xl rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto animate-modal-in shadow-xl"
      >
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-serif-ar text-lg font-bold">{title}</h3>
          <button onClick={onClose} aria-label="إغلاق" className="text-slate-400 hover:text-slate-700">
            <Icon name="x" size={18} />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

function TxModal({ type, initialData, selectedMonth, list, onAddEntry, onClose, onSubmit }) {
  const isDeposit = type === 'deposit';
  const isEdit = !!initialData;
  const [amount, setAmount] = useState(initialData ? String(initialData.amount) : '');
  
  const defaultDate = initialData ? initialData.date : (() => {
    const t = todayStr();
    return t.startsWith(selectedMonth) ? t : startOfMonthStr(selectedMonth);
  })();

  const [date, setDate] = useState(defaultDate);
  const [note, setNote] = useState(initialData ? initialData.note || '' : '');
  const [addingNew, setAddingNew] = useState(false);
  const [newEntry, setNewEntry] = useState('');

  const valid = Number(amount) > 0 && !!date;
  const displayList = note && !list.includes(note) ? [note, ...list] : list;

  function confirmNewEntry() {
    const v = newEntry.trim();
    if (!v) {
      setAddingNew(false);
      return;
    }
    onAddEntry(v);
    setNote(v);
    setNewEntry('');
    setAddingNew(false);
  }

  return (
    <ModalShell
      title={isEdit ? (isDeposit ? 'تعديل الإيداع' : 'تعديل الصرف') : isDeposit ? 'إيداع جديد' : 'صرف جديد'}
      onClose={onClose}
    >
      <label className="block text-xs text-slate-400 mb-1.5">المبلغ</label>
      <div className="relative mb-4">
        <input
          autoFocus
          type="number"
          inputMode="decimal"
          value={amount}
          onChange={(e) => setAmount(e.target.value)}
          placeholder="0"
          dir="ltr"
          className="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm text-left focus:outline-none focus:ring-2 focus:ring-slate-300"
        />
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">ج.م</span>
      </div>

      <label className="block text-xs text-slate-400 mb-1.5">{isDeposit ? 'جهة الإيداع' : 'جهة الصرف'}</label>
      {!addingNew ? (
        <div className="flex gap-2 mb-4">
          <select
            value={note}
            onChange={(e) => setNote(e.target.value)}
            className="flex-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-300"
          >
            <option value="">اختر من القائمة</option>
            {displayList.map((item) => (
              <option key={item} value={item}>
                {item}
              </option>
            ))}
          </select>
          <button
            type="button"
            onClick={() => setAddingNew(true)}
            className="px-3 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 text-sm shrink-0"
          >
            + جديد
          </button>
        </div>
      ) : (
        <div className="flex gap-2 mb-4">
          <input
            autoFocus
            value={newEntry}
            onChange={(e) => setNewEntry(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                confirmNewEntry();
              }
            }}
            placeholder={isDeposit ? 'جهة الإيداع — مثال: راتب' : 'جهة الصرف — مثال: سوبر ماركت'}
            className="flex-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"
          />
          <button
            type="button"
            onClick={confirmNewEntry}
            className="px-3 rounded-lg text-white text-sm shrink-0"
            style={{ background: INK.dark }}
          >
            إضافة
          </button>
          <button
            type="button"
            onClick={() => {
              setAddingNew(false);
              setNewEntry('');
            }}
            className="px-2 text-slate-400 hover:text-slate-600 shrink-0"
          >
            <Icon name="x" size={16} />
          </button>
        </div>
      )}

      <div className="mb-5">
        <label className="block text-xs text-slate-400 mb-1.5">التاريخ فقط</label>
        <input
          type="date"
          value={date}
          onChange={(e) => setDate(e.target.value)}
          className="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"
        />
      </div>

      <button
        disabled={!valid}
        onClick={() => onSubmit({ amount, date, note: note.trim() })}
        className="w-full py-3 rounded-lg text-white text-sm font-medium"
        style={{ background: isDeposit ? INK.deposit : INK.expense, opacity: valid ? 1 : 0.4 }}
      >
        {isEdit ? 'حفظ التعديلات' : isDeposit ? 'إضافة الإيداع' : 'إضافة الصرف'}
      </button>
    </ModalShell>
  );
}

function BackupModal({ data, onClose, onRestore }) {
  const [text, setText] = useState(JSON.stringify(data, null, 2));
  const [status, setStatus] = useState('');

  async function copy() {
    try {
      await navigator.clipboard.writeText(text);
      setStatus('اتنسخت البيانات بنجاح.');
    } catch (e) {
      setStatus('المتصفح منع النسخ. حدّد النص يدويًا وانسخه.');
    }
  }

  function restore() {
    try {
      const parsed = JSON.parse(text);
      const ok = onRestore(parsed);
      if (!ok) setStatus('الملف غير صالح.');
    } catch (e) {
      setStatus('النص غير صالح.');
    }
  }

  return (
    <ModalShell title="نسخة احتياطية" onClose={onClose}>
      <p className="text-xs text-slate-400 mb-3">
        انسخ هذا النص للنسخ الاحتياطي، أو ألصق نصاً تم نسخه سابقاً لاستعادته.
      </p>
      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        dir="ltr"
        rows={8}
        className="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-xs font-mono mb-3 focus:outline-none focus:ring-2 focus:ring-slate-300"
      />
      {status && <div className="text-xs text-slate-500 mb-3">{status}</div>}
      <div className="flex gap-2">
        <button onClick={copy} className="flex-1 py-2.5 rounded-lg text-white text-sm" style={{ background: INK.dark }}>
          نسخ البيانات
        </button>
        <button onClick={restore} className="flex-1 py-2.5 rounded-lg border border-slate-200 text-sm text-slate-600">
          استعادة
        </button>
      </div>
    </ModalShell>
  );
}

function ConfirmModal({ title, message, onCancel, onConfirm }) {

      <p className="text-sm text-slate-500 mb-5">{message}</p>

          إلغاء

}

function ReportPeriodModal({ defaultMonth, onClose, onGenerate }) {
  const [from, setFrom] = useState(startOfMonthStr(defaultMonth));
  const [to, setTo] = useState(endOfMonthStr(defaultMonth));

  function preset(kind) {
    if (kind === 'thisMonth') {
      setFrom(startOfMonthStr(defaultMonth));
      setTo(endOfMonthStr(defaultMonth));
    } else if (kind === 'all') {
      setFrom('');
      setTo('');
    }
  }

  const invalid = from && to && from > to;

  return (
    <ModalShell title="تقرير PDF" onClose={onClose}>
      <p className="text-xs text-slate-400 mb-3">حدد الفترة الزمنية التي تريد استخراج التقرير لها.</p>
      <div className="flex gap-2 mb-4 flex-wrap">
        <button onClick={() => preset('thisMonth')} className="px-3 py-1.5 rounded-full text-xs border border-slate-200 text-slate-500 hover:bg-slate-50">
          الشهر المحدد الحالي
        </button>
        <button onClick={() => preset('all')} className="px-3 py-1.5 rounded-full text-xs border border-slate-200 text-slate-500 hover:bg-slate-50">
          الكل من البداية
        </button>
      </div>
      <div className="grid grid-cols-2 gap-2 mb-5">
        <div>
          <label className="block text-xs text-slate-400 mb-1.5">من تاريخ</label>
          <input
            type="date"
            value={from}
            onChange={(e) => setFrom(e.target.value)}
            className="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"
          />
        </div>
        <div>
          <label className="block text-xs text-slate-400 mb-1.5">إلى تاريخ</label>
          <input
            type="date"
            value={to}
            onChange={(e) => setTo(e.target.value)}
            className="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"
          />
        </div>
      </div>
      {invalid && <p className="text-xs text-rose-500 mb-3">تاريخ البداية يجب أن يكون قبل تاريخ النهاية.</p>}
      <button
        disabled={invalid}
        onClick={() => onGenerate(from, to)}
        className="w-full py-3 rounded-lg text-white text-sm font-medium"
        style={{ background: INK.dark, opacity: invalid ? 0.4 : 1 }}
      >
        عرض التقرير
      </button>
    </ModalShell>
  );
}

                  <tr key={t.id}>
                    <td className="p-2 whitespace-nowrap">{formatDateOnly(t.date)}</td>
                    <td className="p-2">{t.type === 'deposit' ? 'إيداع' : 'صرف'}</td>
                    <td className="p-2">{t.note || '—'}</td>
                    <td
                      dir="ltr"
                      className="p-2 text-left font-semibold whitespace-nowrap"
                      style={{ color: t.type === 'deposit' ? INK.deposit : INK.expense }}
                    >
                      {t.type === 'deposit' ? '+' : '\u2212'}
                      {formatAmount(t.amount)} ج.م
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
